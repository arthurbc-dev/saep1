<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar | Clínica Veterinária</title><link rel="stylesheet" href="style.css"></head>
<body data-pagina="login" class="login-page">
  <main class="simple-login">
    <div class="simple-brand"><span>Clínica Veterinária</span></div>
    <h1>Acessar sistema</h1>
    <p class="simple-subtitle">Entre com seus dados para continuar.</p>
    <form id="formLogin">
      <label for="login">Usuário</label>
      <input type="text" id="login" placeholder="Digite seu usuário" required autofocus>
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
      <p id="msgErro" class="erro" hidden></p>
      <button class="button-primary" type="submit">Entrar</button>
    </form>
  </main>
  <script src="app.js"></script>
</body></html>
